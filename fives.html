@import url('https://fonts.googleapis.com/css2?family=Asimovian&family=Exo+2:wght@500;600;700&display=swap');

.lk-root{
  --bg:#1C1C1C; --panel:#252525; --panel-2:#2E2E2E;
  --lime:#D8F55E; --lime-soft:#E7FA98; --tile-idle:#F0F5E1; --white:#FFFFFF;
  --ink:#15170F; --dark-tile:#191B14;
  --fg:#F2F3EE; --fg-dim:rgba(242,243,238,.52); --line:rgba(242,243,238,.14);
  --disp:'Asimovian', system-ui, sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --tile:'Exo 2', system-ui, sans-serif;
  --r-tile:22%; --r-card:16px; --r-pill:999px;
  box-sizing:border-box; min-height:100vh; background:var(--bg);
  color:var(--fg); font-family:var(--ui);
  display:flex; flex-direction:column; align-items:center;
  /* The viewport is viewport-fit=cover, so the page runs UNDER the status bar
     and the home indicator. In Safari that's invisible, because the browser's
     own chrome pushes everything down. Installed to the home screen there is
     no chrome, and without these insets the clock and battery sit on top of
     the back button. Reported from a real phone, 2026-08-02.

     The gap is a VARIABLE, not a literal, so a screen can ask for different
     headroom without having to restate env() and silently drop the inset.
     .lk-screen did exactly that and cost the picker and packs their insets. */
  --pad-top:20px;
  padding:calc(var(--pad-top) + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(22px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* Standalone gets a little more headroom: the status bar is taller than the
   inset alone allows for once the wordmark is up against it. */
@media (display-mode: standalone){
  .lk-root{ --pad-top:28px; }
  .lk-screen{ --pad-top:24px; }
}

.lk-head{ text-align:center; margin-bottom:10px; position:relative; }
.lk-mark{
  font-family:var(--disp); font-weight:400; font-size:clamp(32px, 9.5vw, 44px);
  letter-spacing:.16em; margin-right:-.16em; color:var(--fg); line-height:1;
}
.lk-rule{ width:96px; height:7px; margin:10px auto 9px; border-radius:var(--r-pill); background:var(--lime); }
.lk-eyebrow{ font-size:11px; letter-spacing:.26em; color:var(--fg-dim); text-transform:uppercase; }

.lk-ticks{ display:flex; gap:12px; margin:3px 0 7px; }
.lk-tick{
  display:flex; flex-direction:column; align-items:center; gap:5px; min-width:52px;
  background:none; border:none; padding:2px 0; font:inherit; color:inherit;
  -webkit-tap-highlight-color:transparent;
}
/* a word you can spend a hint on. Subtle on purpose: the button below is
   still the obvious route, this is the shortcut once you know it's there. */
.lk-tick.aim{ cursor:pointer; }
.lk-tick.aim .lk-tickmark{ border-color:rgba(216,245,94,.45); border-style:dashed; }
.lk-tick.aim:hover .lk-tickmark{ border-color:var(--lime); background:rgba(216,245,94,.12); }
.lk-tick.aim:active .lk-tickmark{ transform:scale(.93); }
.lk-tick:disabled{ cursor:default; }
.lk-tick:focus-visible .lk-tickmark{ outline:2.5px solid var(--lime); outline-offset:3px; }
.lk-tickmark{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--ink); transition:background .3s, border-color .3s, transform .3s;
}
.lk-tickmark.got{ background:var(--lime); border-color:var(--lime); transform:scale(1.06); }
.lk-tickinfo{ font-family:var(--ui); font-size:10px; color:var(--fg-dim); min-height:13px; letter-spacing:.08em; }
/* revealed letters read as given-to-you, not guessed */
.lk-tickinfo.mask{ font-family:var(--tile); font-weight:700; font-size:11.5px; color:var(--lime); letter-spacing:.12em; }

.lk-hint{ font-size:13px; color:var(--fg-dim); max-width:370px; text-align:center; line-height:1.5; margin:0 0 13px; }

.lk-frame{
  position:relative; padding:8px; border:2px solid var(--lime); border-radius:22px;
}
.lk-toast{
  position:absolute; top:-12px; left:50%; transform:translate(-50%,-100%);
  white-space:nowrap; padding:8px 16px; border-radius:var(--r-pill);
  font-family:var(--ui); font-weight:600; font-size:12px; letter-spacing:.04em;
  animation:lk-toastin .25s ease; z-index:5;
}
.lk-toast.hit{ background:var(--lime); color:var(--ink); }
.lk-toast.dim{ background:var(--panel-2); color:var(--fg); }
@keyframes lk-toastin{ from{ opacity:0; transform:translate(-50%,-80%);} to{ opacity:1; transform:translate(-50%,-100%);} }

.lk-board{
  position:relative; width:min(90vw - 20px, 380px); aspect-ratio:1/1;
  background:transparent;
}
.lk-slot{
  position:absolute; top:0; left:0; width:20%; height:20%;
  background:none; border:none; padding:0; cursor:pointer;
  transition:transform .16s cubic-bezier(.2,.7,.3,1);
  -webkit-tap-highlight-color:transparent;
}
.lk-slot:focus-visible .lk-placard{ outline:2.5px solid var(--lime); outline-offset:3px; }
.lk-placard{
  position:absolute; inset:2px; border-radius:var(--r-tile);
  background:var(--tile-idle); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--tile); font-weight:700; font-size:clamp(19px, 5.9vw, 28px);
  transition:background .28s, color .28s, box-shadow .28s, transform .28s;
  user-select:none;
}
.lk-placard.glow{
  background:var(--dark-tile); color:var(--lime);
}
.lk-placard.found{
  background:var(--lime); color:var(--ink);
  animation:lk-pop .32s ease;
}
@keyframes lk-pop{ 40%{ transform:scale(1.07);} 100%{ transform:scale(1);} }

/* board cleared: the tiles fall out of the frame and the result card comes up
   into the empty space. The slot is what's positioned on the grid, so the
   placard inside it is free to be thrown about without disturbing the layout. */
.lk-placard.tumble{
  animation:lk-tumble var(--dur, .9s) cubic-bezier(.5,.02,.9,.36) forwards;
  will-change:transform, opacity;
}
@keyframes lk-tumble{
  0%   { transform:translate(0,0) rotate(0deg); opacity:1; }
  /* small lift before the drop, which is what makes it read as gravity
     rather than as tiles sliding off a table */
  12%  { transform:translate(calc(var(--drift) * .1), -9%) rotate(calc(var(--spin) * .18)); opacity:1; }
  100% { transform:translate(var(--drift), 115vh) rotate(var(--spin)); opacity:.9; }
}
/* the empty slot goes with them rather than sitting there on its own */
.lk-board.tumble .lk-holecup{ opacity:0; transition:opacity .25s; }

@media (prefers-reduced-motion: reduce){
  .lk-placard.tumble{ animation:none; opacity:0; transition:opacity .25s; }
}

/* empty cell */
.lk-holecup{
  position:absolute; top:0; left:0; width:20%; height:20%;
  display:flex; align-items:center; justify-content:center;
  transition:transform .16s cubic-bezier(.2,.7,.3,1); pointer-events:none;
}
.lk-holecup span{
  width:calc(100% - 4px); height:calc(100% - 4px); border-radius:var(--r-tile);
  background:rgba(242,243,238,.035);
  box-shadow: inset 0 0 0 1.5px rgba(242,243,238,.09);
}

.lk-strip{ display:flex; gap:6px; margin-top:13px; width:min(90vw, 400px); }
.lk-plate{
  border:none; border-radius:var(--r-card); padding:11px 6px 12px;
  flex:1 1 0; min-width:0; text-align:center; background:var(--panel);
}
.lk-plate label{

  color:var(--fg); background:var(--panel); border:none; border-radius:var(--r-pill);

.lk-scrim{
  position:fixed; inset:0; background:rgba(12,12,12,.82); backdrop-filter:blur(4px);
